[server]
host = "0.0.0.0"
port = 8080
log_level = "info"
# Set to true behind HTTPS. Localhost is treated as a secure context by browsers.
cookie_secure = false
# Exact origins allowed to call the API with credentials.
cors_origins = ["http://localhost:5173", "http://localhost:5174"]
# Optional signing secret enabling draft page preview. When absent, preview
# token issuance and GET /preview/{path} respond with 501 Not Implemented.
# preview_secret = "long-random-preview-secret"
# Origins allowed to embed the preview in an iframe. Use the admin app origin.
# preview_frame_ancestors = ["https://admin.example.com"]
# Admin application origin used in Feishu notification deep links.
# admin_base_url = "https://admin.example.com"

[database]
platform_path = "./data/platform.sqlite"
stores_dir = "./data/stores"
journal_mode = "wal"
busy_timeout_ms = 5000
max_connections = 5
backup_dir = "./data/backups"

[storage]
provider = "local"
root = "./data/assets"
# Hard cap for one media-library asset upload (bytes).
max_upload_bytes = 104857600

[inquiries]
# Hard cap for one uploaded attachment.
max_upload_bytes = 26214400
# Pending attachment lifetime before cleanup.
upload_ttl_seconds = 3600
# Inquiries and their attachments older than this are deleted by maintenance.
retention_days = 365

[notifications]
# Terminal channel delivery records older than this are deleted by maintenance.
retention_days = 90

[cache]
max_capacity = 10000
ttl_seconds = 60

[storefront]
enabled = true
# "node" uses the Node.js sidecar. The embedded "v8" adapter is not built yet.
runtime = "node"
worker_count = 2
queue_capacity = 128
request_timeout_ms = 10000
node_url = "http://127.0.0.1:8788"
# node_secret = "shared-sidecar-secret"
# Enables the secret-authenticated /internal/storefront HTTP surface for the sidecar.
# internal_fetch_secret = "long-random-internal-secret"
# Signs theme capability grants; capability endpoints sharing this secret can
# verify tokens without a database lookup.
# capability_secret = "long-random-capability-secret"

[jobs]
enabled = true
worker_count = 2

[payments]
# Shared secret for manual/sandbox webhook signatures (x-manual-signature).
# webhook_secret = ""
# Stripe is registered only when both values are present. Prefer supplying
# these through FASTCART_STRIPE_SECRET_KEY and FASTCART_STRIPE_WEBHOOK_SECRET.
# stripe_secret_key = "sk_test_..."
# stripe_webhook_secret = "whsec_..."

[email]
# "log" keeps messages in the process log, "smtp" uses lettre, "resend" uses
# the official Resend Rust SDK.
provider = "log"
from = "orders@example.com"

# [email.smtp]
# host = "smtp.example.com"
# port = 587
# username = "smtp-user"
# password = "smtp-password"
# security = "starttls" # implicit | starttls | plain

# [email.resend]
# api_key = "re_..."
