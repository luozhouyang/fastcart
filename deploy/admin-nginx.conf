# Fastcart Admin: static SPA plus a same-origin reverse proxy for the API.
#
# nginx is the Admin origin. `/api/` is forwarded to the Rust server so the
# browser sees one origin for the SPA and the API, and session/CSRF cookies
# need no cross-origin configuration. TLS is terminated by an external proxy;
# this config forwards the incoming scheme (if any) to the server.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Preserve an external proxy's scheme (https) instead of overwriting it with
# the plain-HTTP scheme nginx sees from that proxy.
map $http_x_forwarded_proto $fastcart_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads go through this proxy. Match the server's default 100 MiB
    # asset upload cap; raise both limits together if you change it.
    client_max_body_size 100m;

    # Container/orchestrator health probe. Independent of the API upstream.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Same-origin API. `proxy_pass` has no URI part, so /api/v1/... is sent
    # unchanged to the server.
    location /api/ {
        proxy_pass http://fastcart:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $fastcart_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Vite emits content-hashed files under assets/. Cache them forever; never
    # fall back to index.html for a missing asset.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The SPA shell must revalidate so a new deployment is picked up.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
