[workspace]
resolver = "2"
members = [
    "apps/server",
    "crates/kernel",
    "crates/platform",
    "crates/commerce",
    "crates/infrastructure",
    "crates/http",
    "crates/workflows",
    "crates/api",
    "crates/storefront",
    "crates/storefront-runtime/runtime-api",
    "crates/storefront-runtime/runtime-v8",
    "crates/storefront-runtime/runtime-pool",
    "crates/storefront-runtime/runtime-bridge",
    "crates/storefront-runtime/runtime-node",
    "crates/plugin",
    "crates/ai",
    "crates/cli",
    "crates/modules/store",
    "crates/modules/catalog",
    "crates/modules/pricing",
    "crates/modules/inventory",
    "crates/modules/customer",
    "crates/modules/cart",
    "crates/modules/promotion",
    "crates/modules/checkout",
    "crates/modules/order",
    "crates/modules/payment",
    "crates/modules/shipping",
    "crates/modules/tax",
    "crates/modules/content",
    "crates/modules/webhook",
    "crates/modules/theme",
    "crates/email",
    "crates/notifications",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.104"
async-stripe = { version = "0.41.0", default-features = false, features = ["runtime-tokio-hyper-rustls", "webhook-events", "uuid"] }
argon2 = "0.5.3"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.22.1"
cookie = "0.18.2"
email_address = "0.2.9"
governor = "0.10.4"
iso_currency = "0.7.1"
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls-tls", "pool", "hostname"] }
resend-rs = { version = "0.35.1", default-features = false, features = ["rustls-tls"] }
rust_iso3166 = "0.2.0"
slug = "0.1.6"
unic-langid = "0.9.6"
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.12.1"
http-body-util = "0.1.3"
minijinja = "3.0.5"
moka = { version = "0.12.16", features = ["future", "sync"] }
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
subtle = "2.6.1"
tempfile = "3.24.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "cors", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }

fastcart-ai = { path = "crates/ai" }
fastcart-api = { path = "crates/api" }
fastcart-commerce = { path = "crates/commerce" }
fastcart-http = { path = "crates/http" }
fastcart-infrastructure = { path = "crates/infrastructure" }
fastcart-kernel = { path = "crates/kernel" }
fastcart-module-cart = { path = "crates/modules/cart" }
fastcart-module-catalog = { path = "crates/modules/catalog" }
fastcart-module-checkout = { path = "crates/modules/checkout" }
fastcart-module-content = { path = "crates/modules/content" }
fastcart-module-customer = { path = "crates/modules/customer" }
fastcart-module-inventory = { path = "crates/modules/inventory" }
fastcart-module-order = { path = "crates/modules/order" }
fastcart-module-payment = { path = "crates/modules/payment" }
fastcart-module-pricing = { path = "crates/modules/pricing" }
fastcart-module-promotion = { path = "crates/modules/promotion" }
fastcart-module-shipping = { path = "crates/modules/shipping" }
fastcart-module-store = { path = "crates/modules/store" }
fastcart-module-tax = { path = "crates/modules/tax" }
fastcart-module-theme = { path = "crates/modules/theme" }
fastcart-module-webhook = { path = "crates/modules/webhook" }
fastcart-notifications = { path = "crates/notifications" }
fastcart-email = { path = "crates/email" }
fastcart-platform = { path = "crates/platform" }
fastcart-plugin = { path = "crates/plugin" }
fastcart-runtime-api = { path = "crates/storefront-runtime/runtime-api" }
fastcart-runtime-bridge = { path = "crates/storefront-runtime/runtime-bridge" }
fastcart-runtime-node = { path = "crates/storefront-runtime/runtime-node" }
fastcart-runtime-pool = { path = "crates/storefront-runtime/runtime-pool" }
fastcart-runtime-v8 = { path = "crates/storefront-runtime/runtime-v8" }
fastcart-server = { path = "apps/server" }
fastcart-storefront = { path = "crates/storefront" }
fastcart-workflows = { path = "crates/workflows" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
