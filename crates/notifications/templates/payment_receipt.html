<!doctype html>
<html lang="en">
  <body>
    <p>Hi,</p>
    <p>We received your payment{% if display_number %} for order <strong>#{{ display_number }}</strong>{% endif %}.</p>
    <p>Amount: <strong>{{ amount }}</strong></p>
    {% if provider_id %}<p>Payment method: {{ provider_id }}</p>{% endif %}
    <p>This receipt confirms that the payment was captured successfully.</p>
    <p>Thank you.</p>
  </body>
</html>
